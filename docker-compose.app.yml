services:
  user-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./user-service:/app
      - user_service_node_modules:/app/node_modules
    env_file:
      - ./user-service/.env
    environment:
      SERVICE_TOKEN: internal-service-token
      IMAGE_SERVICE_URL: http://image-service:3007
      JWT_EXPIRES_IN: 7d
    networks:
      - app-network

  vehicle-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./vehicle-service:/app
      - vehicle_service_node_modules:/app/node_modules
    env_file:
      - ./vehicle-service/.env
    environment:
      REDIS_URL: redis://:password@redis:6379
      IMAGE_SERVICE_URL: http://image-service:3007
      USER_SERVICE_URL: http://user-service:3001
      SERVICE_TOKEN: internal-service-token
      AI_SERVICE_URL: http://ai-service:5010
    depends_on:
      redis:
        condition: service_healthy
      image-service:
        condition: service_started
    networks:
      - app-network

  rental-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./rental-service:/app
      - rental_service_node_modules:/app/node_modules
    env_file:
      - ./rental-service/.env
    environment:
      RABBITMQ_URI: amqp://admin:password@rabbitmq:5672
      VEHICLE_SERVICE_URL: http://vehicle-service:3002
      USER_SERVICE_URL: http://user-service:3001
      CONTRACT_SERVICE_URL: http://contract-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      SERVICE_TOKEN: internal-service-token
      SAGA_MAX_RETRY: 2
      SAGA_RETRY_DELAY_MS: 3000
    depends_on:
      rabbitmq:
        condition: service_healthy
      vehicle-service:
        condition: service_started
    networks:
      - app-network

  contract-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./contract-service:/app
      - contract_service_node_modules:/app/node_modules
    env_file:
      - ./contract-service/.env
    environment:
      RABBITMQ_URI: amqp://admin:password@rabbitmq:5672
      IMAGE_SERVICE_URL: http://image-service:3007
      SERVICE_TOKEN: internal-service-token
    depends_on:
      rabbitmq:
        condition: service_healthy
      image-service:
        condition: service_started
    networks:
      - app-network

  payment-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./payment-service:/app
      - payment_service_node_modules:/app/node_modules
    env_file:
      - ./payment-service/.env
    environment:
      RABBITMQ_URI: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  tracking-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./tracking-service:/app
      - tracking_service_node_modules:/app/node_modules
    env_file:
      - ./tracking-service/.env
    environment:
      RABBITMQ_URI: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  image-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    ports:
      - "3007:3007"
    volumes:
      - ./image-service:/app
      - image_service_node_modules:/app/node_modules
    env_file:
      - ./image-service/.env
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-local-dev-bucket}
      USE_LOCAL_IMAGE_STORAGE: ${USE_LOCAL_IMAGE_STORAGE:-true}
      SERVICE_TOKEN: internal-service-token
    networks:
      - app-network

  dispute-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./dispute-service:/app
      - dispute_service_node_modules:/app/node_modules
    env_file:
      - ./dispute-service/.env
    environment:
      RABBITMQ_URI: amqp://admin:password@rabbitmq:5672
      CONTRACT_SERVICE_URL: http://contract-service:3004
    depends_on:
      rabbitmq:
        condition: service_healthy
      contract-service:
        condition: service_started
    networks:
      - app-network

  review-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./review-service:/app
      - review_service_node_modules:/app/node_modules
    env_file:
      - ./review-service/.env
    networks:
      - app-network

  notification-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./notification-service:/app
      - notification_service_node_modules:/app/node_modules
    env_file:
      - ./notification-service/.env
    environment:
      RABBITMQ_URI: amqp://admin:password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  statistic-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./statistic-service:/app
      - statistic_service_node_modules:/app/node_modules
    env_file:
      - ./statistic-service/.env
    environment:
      REDIS_URL: redis://:password@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  ai-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./ai-service:/app
      - ai_service_node_modules:/app/node_modules
    environment:
      PORT: 5010
      NODE_ENV: development
      STATISTIC_SERVICE_URL: http://statistic-service:3011
      REVIEW_SERVICE_URL: http://review-service:3009
      VEHICLE_SERVICE_URL: http://vehicle-service:3002
      RENTAL_SERVICE_URL: http://rental-service:3003
      INSPECTION_SERVICE_URL: http://inspection-service:3012
      USER_SERVICE_URL: http://user-service:3001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      review-service:
        condition: service_started
      statistic-service:
        condition: service_started
      vehicle-service:
        condition: service_started
      rental-service:
        condition: service_started
    networks:
      - app-network

  ai-agent-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    volumes:
      - ./ai-agent-service:/app
      - ai_agent_service_node_modules:/app/node_modules
    environment:
      PORT: 5011
      NODE_ENV: development
      VEHICLE_SERVICE_URL: http://vehicle-service:3002
      RENTAL_SERVICE_URL: http://rental-service:3003
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      vehicle-service:
        condition: service_started
      rental-service:
        condition: service_started
    networks:
      - app-network

  api-gateway:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run start"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    env_file:
      - ./api-gateway/.env
    environment:
      USER_SERVICE_URL: http://user-service:3001
      VEHICLE_SERVICE_URL: http://vehicle-service:3002
      RENTAL_SERVICE_URL: http://rental-service:3003
      CONTRACT_SERVICE_URL: http://contract-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      TRACKING_SERVICE_URL: http://tracking-service:3006
      DISPUTE_SERVICE_URL: http://dispute-service:3008
      REVIEW_SERVICE_URL: http://review-service:3009
      NOTIFICATION_SERVICE_URL: http://notification-service:3010
      STATISTIC_SERVICE_URL: http://statistic-service:3011
      AI_SERVICE_URL: http://ai-service:5010
      AI_AGENT_SERVICE_URL: http://ai-agent-service:5011
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
    depends_on:
      user-service:
        condition: service_started
      vehicle-service:
        condition: service_started
      rental-service:
        condition: service_started
      contract-service:
        condition: service_started
      payment-service:
        condition: service_started
      tracking-service:
        condition: service_started
      dispute-service:
        condition: service_started
      review-service:
        condition: service_started
      notification-service:
        condition: service_started
      statistic-service:
        condition: service_started
      ai-service:
        condition: service_started
      ai-agent-service:
        condition: service_started
    networks:
      - app-network

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    env_file:
      - ./web/.env
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - app-network

volumes:
  user_service_node_modules:
  vehicle_service_node_modules:
  rental_service_node_modules:
  contract_service_node_modules:
  payment_service_node_modules:
  tracking_service_node_modules:
  image_service_node_modules:
  dispute_service_node_modules:
  review_service_node_modules:
  notification_service_node_modules:
  statistic_service_node_modules:
  ai_service_node_modules:
  ai_agent_service_node_modules:
  api_gateway_node_modules:
  web_node_modules:
